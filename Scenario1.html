
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 25px;
            width: 650px;
            margin: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .summary {
            text-align: right;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 align="center">Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cart"></tbody>
    </table>

    <div class="summary">
        <p id="subtotal"></p>
        <p id="discount"></p>
        <h3 id="payable"></h3>
    </div>
</div>

<script>

let items = [
    {name: "Notebook", price: 120, qty: 1},
    {name: "Pen Pack", price: 60, qty: 1},
    {name: "Water Bottle", price: 350, qty: 1}
];

function displayCart() {

    let cart = document.getElementById("cart");
    cart.innerHTML = "";

    let subtotal = 0;

    items.forEach((item, index) => {

        let total = item.price * item.qty;
        subtotal += total;

        cart.innerHTML += `
            <tr>
                <td>${item.name}</td>
                <td>Rs. ${item.price}</td>
                <td>
                    <button onclick="changeQty(${index}, -1)">-</button>
                    ${item.qty}
                    <button onclick="changeQty(${index}, 1)">+</button>
                </td>
                <td>Rs. ${total}</td>
                <td>
                    <button onclick="removeItem(${index})">
                        Remove
                    </button>
                </td>
            </tr>
        `;
    });

    let discount = subtotal >= 1000 ? subtotal * 0.10 : 0;
    let payable = subtotal - discount;

    document.getElementById("subtotal").innerText =
        "Subtotal: Rs. " + subtotal;

    document.getElementById("discount").innerText =
        "Discount (10%): Rs. " + discount;

    document.getElementById("payable").innerText =
        "Amount Payable: Rs. " + payable;

    if (items.length === 0) {
        cart.innerHTML =
            "<tr><td colspan='5'>Your cart is empty.</td></tr>";

        document.getElementById("subtotal").innerText = "";
        document.getElementById("discount").innerText = "";
        document.getElementById("payable").innerText = "";
    }
}

function changeQty(index, change) {

    if (items[index].qty + change >= 1) {
        items[index].qty += change;
    }

    displayCart();
}

function removeItem(index) {
    items.splice(index, 1);
    displayCart();
}

displayCart();

</script>

</body>
</html>
